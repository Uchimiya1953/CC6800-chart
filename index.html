<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TEREX DEMAG CC6800 荷重表ナビゲーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    .font-tech { font-family: 'Chakra Petch', sans-serif; }
    #pdfCanvasContainer {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100%;
      background-color: #0f172a;
      padding: 16px;
    }
    canvas {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
      max-width: 100%;
      height: auto !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- ヘッダー -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center gap-3">
      <div class="bg-amber-500 text-slate-950 font-tech font-bold px-2 py-0.5 rounded text-sm tracking-wider">CC6800</div>
      <div>
        <h1 class="text-sm md:text-base font-bold text-white leading-tight">定格総荷重表ナビゲーター</h1>
        <p class="text-[10px] text-slate-400">TEREX DEMAG GmbH • 全4,823ページ対応高速リーダー</p>
      </div>
    </div>

    <!-- ページ操作・ファイル選択 -->
    <div class="flex items-center gap-2">
      <!-- PDF再読み込みボタン -->
      <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1 rounded text-xs flex items-center gap-1 font-medium cursor-pointer transition-colors">
        <i data-lucide="file-up" class="w-3.5 h-3.5 text-amber-400"></i>
        <span class="hidden sm:inline">PDFを選択</span>
        <input type="file" id="filePicker" accept=".pdf" class="hidden">
      </label>

      <!-- ページ送り -->
      <div class="flex items-center bg-slate-800 rounded border border-slate-700 px-2 py-1">
        <button id="prevPageBtn" class="text-slate-300 hover:text-amber-400 p-1"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
        <input type="number" id="pageInput" min="1" max="4823" value="1" class="w-14 bg-slate-900 text-center font-tech text-amber-400 text-sm font-bold border border-slate-700 rounded mx-1 py-0.5 focus:outline-none focus:border-amber-500">
        <span id="pageTotal" class="text-xs text-slate-400 font-tech">/ 4,823</span>
        <button id="nextPageBtn" class="text-slate-300 hover:text-amber-400 p-1"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
      </div>

      <!-- ズーム -->
      <div class="hidden sm:flex items-center bg-slate-800 rounded border border-slate-700 px-1.5 py-1">
        <button id="zoomOutBtn" class="p-1 text-slate-300 hover:text-amber-400" title="縮小"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
        <span id="zoomLevel" class="text-xs font-tech text-slate-300 px-1.5">100%</span>
        <button id="zoomInBtn" class="p-1 text-slate-300 hover:text-amber-400" title="拡大"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
      </div>

      <button id="toggleSidebarBtn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 p-1.5 rounded font-bold flex items-center gap-1 text-xs md:hidden">
        <i data-lucide="search" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- メインエリア -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- 左側サイドバー（検索・仕様選択パネル） -->
    <aside id="sidebar" class="absolute md:static top-0 left-0 bottom-0 z-30 w-80 bg-slate-900 border-r border-slate-800 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0">
      <div class="p-4 border-b border-slate-800">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold text-amber-400 flex items-center gap-1.5 uppercase tracking-wider">
            <i data-lucide="sliders" class="w-3.5 h-3.5"></i> 仕様から絞り込みジャンプ
          </span>
          <button id="closeSidebarBtn" class="text-slate-400 hover:text-white md:hidden">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- 形式選択 -->
        <label class="block text-xs font-medium text-slate-300 mb-1">基本仕様 / アタッチメント</label>
        <select id="configType" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2.5 py-1.5 text-xs focus:outline-none focus:border-amber-500 mb-3">
          <option value="SH">SH仕様 (主ジブ 36〜96m)</option>
          <option value="LH">LH仕様 (主ジブ 42〜90m)</option>
          <option value="SH_LH">SH/LH仕様 (主ジブ 48〜108m)</option>
          <option value="SSL">SSL仕様 (スーパーリフト主ジブ 42〜96m)</option>
          <option value="SSL_LSL">SSL/LSL仕様 (SL主ジブ 102〜150m)</option>
          <option value="SWSL_87">SWSL仕様 (スーパーリフト+起伏ジブ 87°)</option>
          <option value="SWSL_85">SWSL仕様 (スーパーリフト+起伏ジブ 85°)</option>
          <option value="SWSL_75">SWSL仕様 (スーパーリフト+起伏ジブ 75°)</option>
          <option value="SWSL_65">SWSL仕様 (スーパーリフト+起伏ジブ 65°)</option>
        </select>

        <!-- ブーム長選択 -->
        <div class="grid grid-cols-2 gap-2 mb-3">
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-1">主ブーム長</label>
            <select id="boomLength" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500"></select>
          </div>
          <div id="jibLengthContainer">
            <label class="block text-[11px] font-medium text-slate-300 mb-1">ラフィングジブ長</label>
            <select id="jibLength" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500"></select>
          </div>
        </div>

        <button id="jumpPresetBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded text-xs flex items-center justify-center gap-1.5 transition-colors shadow">
          <i data-lucide="external-link" class="w-4 h-4"></i> 該当する荷重表を開く
        </button>
      </div>

      <!-- クイックインデックス一覧 -->
      <div class="flex-1 overflow-y-auto p-3 space-y-1.5" id="quickIndexList">
        <div class="text-[11px] font-bold text-slate-400 px-2 py-1 uppercase tracking-wider">主要セクション直接移動</div>
      </div>
    </aside>

    <!-- PDF描画エリア -->
    <main class="flex-1 overflow-auto bg-slate-950 relative" id="pdfViewerArea">
      <!-- 初回ファイル選択画面（未読込時） -->
      <div id="dropPrompt" class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center p-6 text-center z-10">
        <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 mb-4 shadow-lg shadow-amber-500/5">
          <i data-lucide="file-text" class="w-8 h-8"></i>
        </div>
        <h2 class="text-base font-bold text-white mb-2">CC6800荷重表.pdf を選択してください</h2>
        <p class="text-xs text-slate-400 max-w-md mb-6 leading-relaxed">
          Googleドライブを介さずブラウザ内で直接高速展開するため、4,823ページすべてエラーなく一瞬で開けます。ファイルが外部に送信されることはありません。
        </p>
        <label class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2.5 rounded-lg text-sm flex items-center gap-2 cursor-pointer shadow-lg shadow-amber-500/20 transition-all transform active:scale-95">
          <i data-lucide="upload" class="w-4 h-4"></i>
          <span>PDFファイルを選択する</span>
          <input type="file" id="mainFilePicker" accept=".pdf" class="hidden">
        </label>
      </div>

      <!-- 描画キャンバス -->
      <div id="pdfCanvasContainer" class="hidden">
        <canvas id="pdfCanvas"></canvas>
      </div>
    </main>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.35;
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');

    const INDEX_DATA = [
      { title: "作業範囲図 (SH / LH)", page: 1 },
      { title: "SH 36m (定格総荷重表)", page: 2 },
      { title: "SH 42m (定格総荷重表)", page: 3 },
      { title: "SH 48m (定格総荷重表)", page: 4 },
      { title: "SH 60m (定格総荷重表)", page: 6 },
      { title: "SH 84m (定格総荷重表)", page: 10 },
      { title: "SH 96m (定格総荷重表)", page: 12 },
      { title: "SH/LH 48m", page: 13 },
      { title: "LH 42m (定格総荷重表)", page: 24 },
      { title: "SSL / SSL-LSL 作業範囲図", page: 33 },
      { title: "SSL 42m (SL-R: 24m)", page: 34 },
      { title: "SSL 60m (SL-R: 24m)", page: 37 },
      { title: "SSL 84m (SL-R: 24m)", page: 41 },
      { title: "SSL 96m (SL-R: 24m)", page: 43 },
      { title: "SSL/LSL 102m (SL-R: 24m)", page: 114 },
      { title: "SSL/LSL 120m (SL-R: 24m)", page: 117 },
      { title: "SSL/LSL 150m (SL-R: 24m)", page: 122 },
      { title: "SWSL (スーパーリフト+起伏ジブ) 概要図", page: 151 },
      { title: "SWSL 主ブーム48m + 起伏ジブ", page: 180 },
      { title: "SWSL 主ブーム60m + 起伏ジブ", page: 320 },
      { title: "SWSL 主ブーム72m + 起伏ジブ", page: 650 },
      { title: "SWSL 主ブーム84m + 起伏ジブ", page: 1100 },
      { title: "SWSL 主ブーム96m + 起伏ジブ", page: 1800 },
      { title: "SWSL 主ブーム108m + 起伏ジブ", page: 2600 }
    ];

    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = { canvasContext: ctx, viewport: viewport };
        const renderTask = page.render(renderContext);

        renderTask.promise.then(function() {
          pageRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });
      document.getElementById('pageInput').value = num;
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function goToPage(num) {
      if (!pdfDoc) return;
      const p = Math.max(1, Math.min(pdfDoc.numPages, parseInt(num) || 1));
      pageNum = p;
      queueRenderPage(pageNum);
    }

    // ローカルPDF読み込みハンドラ
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fileReader = new FileReader();
      fileReader.onload = function() {
        const typedarray = new Uint8Array(this.result);
        pdfjsLib.getDocument(typedarray).promise.then(function(pdfDoc_) {
          pdfDoc = pdfDoc_;
          document.getElementById('pageTotal').innerText = `/ ${pdfDoc.numPages}`;
          document.getElementById('pageInput').max = pdfDoc.numPages;
          document.getElementById('dropPrompt').classList.add('hidden');
          document.getElementById('pdfCanvasContainer').classList.remove('hidden');
          renderPage(pageNum);
        }).catch(err => {
          alert("PDFの読み込みに失敗しました: " + err.message);
        });
      };
      fileReader.readAsArrayBuffer(file);
    }

    document.getElementById('filePicker').addEventListener('change', handleFileSelect);
    document.getElementById('mainFilePicker').addEventListener('change', handleFileSelect);

    // ページ送りボタン
    document.getElementById('prevPageBtn').addEventListener('click', () => { if (pageNum > 1) goToPage(pageNum - 1); });
    document.getElementById('nextPageBtn').addEventListener('click', () => { if (pdfDoc && pageNum < pdfDoc.numPages) goToPage(pageNum + 1); });
    document.getElementById('pageInput').addEventListener('change', (e) => goToPage(e.target.value));

    // ズーム
    document.getElementById('zoomInBtn').addEventListener('click', () => {
      scale = Math.min(3.0, scale + 0.2);
      document.getElementById('zoomLevel').innerText = Math.round((scale / 1.35) * 100) + '%';
      if (pdfDoc) queueRenderPage(pageNum);
    });
    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      scale = Math.max(0.6, scale - 0.2);
      document.getElementById('zoomLevel').innerText = Math.round((scale / 1.35) * 100) + '%';
      if (pdfDoc) queueRenderPage(pageNum);
    });

    // 仕様選択の初期化
    const boomSelect = document.getElementById('boomLength');
    const jibSelect = document.getElementById('jibLength');
    const configSelect = document.getElementById('configType');

    function updateOptions() {
      const type = configSelect.value;
      const isSWSL = type.startsWith('SWSL');
      document.getElementById('jibLengthContainer').style.display = isSWSL ? 'block' : 'none';

      let booms = isSWSL 
        ? [48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108] 
        : [36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108, 114, 120, 126, 132, 138, 144, 150];

      boomSelect.innerHTML = booms.map(b => `<option value="${b}">${b} m</option>`).join('');
      
      let jibs = [24, 30, 36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108];
      jibSelect.innerHTML = jibs.map(j => `<option value="${j}">${j} m</option>`).join('');
    }

    configSelect.addEventListener('change', updateOptions);
    updateOptions();

    // 絞り込みから該当ページへのジャンプ処理
    document.getElementById('jumpPresetBtn').addEventListener('click', () => {
      const type = configSelect.value;
      const boom = parseInt(boomSelect.value);
      
      if (type === 'SH') {
        const shMap = { 36:2, 42:3, 48:4, 54:5, 60:6, 66:7, 72:8, 78:9, 84:10, 90:11, 96:12 };
        if (shMap[boom]) goToPage(shMap[boom]);
      } else if (type === 'LH') {
        const lhMap = { 42:24, 48:25, 54:26, 60:27, 66:28, 72:29, 78:30, 84:31, 90:32 };
        if (lhMap[boom]) goToPage(lhMap[boom]);
      } else if (type === 'SH_LH') {
        goToPage(13);
      } else if (type === 'SSL') {
        const sslMap = { 42:34, 48:35, 54:36, 60:37, 66:38, 72:39, 78:40, 84:41, 90:42, 96:43 };
        if (sslMap[boom]) goToPage(sslMap[boom]);
      } else if (type === 'SSL_LSL') {
        const lslMap = { 102:114, 108:115, 114:116, 120:117, 126:118, 132:119, 138:120, 144:121, 150:122 };
        if (lslMap[boom]) goToPage(lslMap[boom]);
      } else if (type.startsWith('SWSL')) {
        const swslMap = { 48:180, 54:250, 60:320, 66:480, 72:650, 78:850, 84:1100, 90:1450, 96:1800, 102:2200, 108:2600 };
        if (swslMap[boom]) goToPage(swslMap[boom]);
      }
      
      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.add('-translate-x-full');
      }
    });

    // クイックインデックス生成
    const quickList = document.getElementById('quickIndexList');
    INDEX_DATA.forEach(item => {
      const btn = document.createElement('button');
      btn.className = "w-full text-left px-2.5 py-1.5 rounded bg-slate-950/60 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 text-xs transition-colors flex items-center justify-between";
      btn.innerHTML = `<span class="truncate text-slate-300">${item.title}</span><span class="font-tech text-amber-400 font-bold ml-2">P.${item.page}</span>`;
      btn.onclick = () => {
        goToPage(item.page);
        if (window.innerWidth < 768) {
          document.getElementById('sidebar').classList.add('-translate-x-full');
        }
      };
      quickList.appendChild(btn);
    });

    document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    });
    document.getElementById('closeSidebarBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.add('-translate-x-full');
    });

    lucide.createIcons();
  </script>
</body>
</html>
