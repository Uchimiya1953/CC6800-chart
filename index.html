<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TEREX DEMAG CC6800 荷重表スマートナビゲーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    .font-tech { font-family: 'Chakra Petch', sans-serif; }
    #pdfCanvasContainer {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100%;
      background-color: #0f172a;
      padding: 16px;
    }
    canvas {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
      max-width: 100%;
      height: auto !important;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- ヘッダー -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center gap-3">
      <div class="bg-amber-500 text-slate-950 font-tech font-bold px-2 py-0.5 rounded text-sm tracking-wider">CC6800</div>
      <div>
        <h1 class="text-sm md:text-base font-bold text-white leading-tight">定格総荷重表スマートナビゲーター</h1>
        <p class="text-[10px] text-slate-400">TEREX DEMAG GmbH • 揚重計画ダイレクト選定</p>
      </div>
    </div>

    <!-- ページ送り & 操作ツール -->
    <div class="flex items-center gap-2">
      <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1 rounded text-xs flex items-center gap-1 font-medium cursor-pointer transition-colors" title="別のPDFを開く">
        <i data-lucide="folder-open" class="w-3.5 h-3.5 text-amber-400"></i>
        <span class="hidden sm:inline">PDF変更</span>
        <input type="file" id="filePicker" accept=".pdf" class="hidden">
      </label>

      <div class="flex items-center bg-slate-800 rounded border border-slate-700 px-2 py-1">
        <button id="prevPageBtn" class="text-slate-300 hover:text-amber-400 p-1"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
        <input type="number" id="pageInput" min="1" max="4823" value="1" class="w-14 bg-slate-900 text-center font-tech text-amber-400 text-sm font-bold border border-slate-700 rounded mx-1 py-0.5 focus:outline-none focus:border-amber-500">
        <span id="pageTotal" class="text-xs text-slate-400 font-tech">/ 4,823</span>
        <button id="nextPageBtn" class="text-slate-300 hover:text-amber-400 p-1"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
      </div>

      <div class="hidden sm:flex items-center bg-slate-800 rounded border border-slate-700 px-1.5 py-1">
        <button id="zoomOutBtn" class="p-1 text-slate-300 hover:text-amber-400" title="縮小"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
        <span id="zoomLevel" class="text-xs font-tech text-slate-300 px-1.5">100%</span>
        <button id="zoomInBtn" class="p-1 text-slate-300 hover:text-amber-400" title="拡大"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
      </div>

      <button id="toggleSidebarBtn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 p-1.5 rounded font-bold flex items-center gap-1 text-xs md:hidden">
        <i data-lucide="sliders" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- メインエリア -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- 左側サイドバー（条件入力 ＆ しおりパネル） -->
    <aside id="sidebar" class="absolute md:static top-0 left-0 bottom-0 z-30 w-84 bg-slate-900 border-r border-slate-800 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0">
      
      <!-- 条件入力フィルターエリア -->
      <div class="p-3 border-b border-slate-800 bg-slate-900/95 space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-amber-400 flex items-center gap-1.5 uppercase tracking-wider">
            <i data-lucide="filter" class="w-4 h-4"></i> 揚重条件ダイレクト選定
          </span>
          <button id="closeSidebarBtn" class="text-slate-400 hover:text-white md:hidden">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- 1. 仕様選択 -->
        <div>
          <label class="block text-[11px] font-medium text-slate-300 mb-1">仕様 / アタッチメント</label>
          <select id="selType" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500">
            <option value="SWSL">SWSL (スーパーリフト+起伏ジブ)</option>
            <option value="SSL">SSL (スーパーリフト主ジブ 42〜96m)</option>
            <option value="SSL/LSL">SSL/LSL (SL主ジブ 102〜150m)</option>
            <option value="SH">SH (主ジブ 36〜96m)</option>
            <option value="LH">LH (主ジブ 42〜90m)</option>
            <option value="SH/LH">SH/LH (主ジブ 48〜108m)</option>
            <option value="SW">SW (起伏ジブ)</option>
            <option value="LFVL">LFVL (スーパーリフト固定ジブ)</option>
          </select>
        </div>

        <!-- 2. 主ジブ角度 & SLウエイト半径 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-1">主ジブ角度</label>
            <select id="selAngle" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500">
              <option value="87°">87°</option>
              <option value="85°">85°</option>
              <option value="75°">75°</option>
              <option value="65°">65°</option>
              <option value="">指定なし</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-1">SL半径</label>
            <select id="selRadius" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500">
              <option value="24m">24m</option>
              <option value="21m">21m</option>
              <option value="18m">18m</option>
              <option value="15m">15m</option>
              <option value="">指定なし</option>
            </select>
          </div>
        </div>

        <!-- 3. 主ジブ長さ & 補ジブ長さ -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-1">主ジブ長さ</label>
            <select id="selMainBoom" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500">
              <option value="">指定なし</option>
              <!-- 48m〜108m 等が動的または固定で入る -->
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-1">補ジブ長さ</label>
            <select id="selJib" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500">
              <option value="">指定なし</option>
              <!-- 24m〜108m 等が入る -->
            </select>
          </div>
        </div>

        <!-- ダイレクトジャンプボタン -->
        <button id="directJumpBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded text-xs flex items-center justify-center gap-1.5 transition-colors shadow">
          <i data-lucide="zap" class="w-4 h-4"></i> 該当する荷重表を開く
        </button>
      </div>

      <!-- 目次テキスト検索 & 結果ツリー -->
      <div class="p-2 border-b border-slate-800 bg-slate-950/40">
        <div class="relative">
          <input type="text" id="outlineSearch" placeholder="目次内フリーワード検索..." class="w-full bg-slate-950 border border-slate-700 text-slate-200 placeholder-slate-500 rounded px-2.5 py-1.5 pl-8 text-xs focus:outline-none focus:border-amber-500">
          <i data-lucide="search" class="w-3.5 h-3.5 text-slate-500 absolute left-2.5 top-2.5"></i>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-2 space-y-1" id="outlineContainer">
        <div class="text-xs text-slate-500 p-4 text-center">
          PDFを選択すると、ここに全しおりと解析済み条件が反映されます。
        </div>
      </div>

      <div class="p-2.5 bg-slate-950/80 border-t border-slate-800 text-[11px] flex items-center justify-between text-slate-400">
        <span>ヒット件数:</span>
        <span id="matchCount" class="font-tech text-amber-400 font-bold">0 件</span>
      </div>
    </aside>

    <!-- PDF描画エリア -->
    <main class="flex-1 overflow-auto bg-slate-950 relative" id="pdfViewerArea">
      <div id="dropPrompt" class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center p-6 text-center z-10">
        <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 mb-4 shadow-lg shadow-amber-500/5">
          <i data-lucide="file-text" class="w-8 h-8"></i>
        </div>
        <h2 class="text-lg font-bold text-white mb-2">CC6800荷重表.pdf を選択してください</h2>
        <p class="text-xs text-slate-400 max-w-md mb-6 leading-relaxed">
          原本PDFを選択すると、PDF内の**4,823ページ分のしおり**を全自動で読み込み、「主ジブ長さ」「補ジブ長さ」「SL半径」「角度」の選定メニューを瞬時に構築します。
        </p>
        <label class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2.5 rounded-lg text-sm flex items-center gap-2 cursor-pointer shadow-lg shadow-amber-500/20 transition-all transform active:scale-95">
          <i data-lucide="upload" class="w-4 h-4"></i>
          <span>PDFファイルを選択する</span>
          <input type="file" id="mainFilePicker" accept=".pdf" class="hidden">
        </label>
      </div>

      <div id="pdfCanvasContainer" class="hidden">
        <canvas id="pdfCanvas"></canvas>
      </div>
    </main>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.35;
    
    // 解析した全しおりデータベース
    let bookmarkDatabase = [];

    // CC6800の標準規格長リスト
    const STANDARD_MAIN_BOOMS = [36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108, 114, 120, 126, 132, 138, 144, 150];
    const STANDARD_JIBS = [24, 30, 36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108];

    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');

    // 初期状態で長さ選択肢を設定
    function initStandardOptions() {
      const selMain = document.getElementById('selMainBoom');
      const selJib = document.getElementById('selJib');
      
      selMain.innerHTML = '<option value="">指定なし</option>' + 
        STANDARD_MAIN_BOOMS.map(b => `<option value="${b}m">${b}m</option>`).join('');
      
      selJib.innerHTML = '<option value="">指定なし</option>' + 
        STANDARD_JIBS.map(j => `<option value="${j}m">${j}m</option>`).join('');
    }
    initStandardOptions();

    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = { canvasContext: ctx, viewport: viewport };
        const renderTask = page.render(renderContext);

        renderTask.promise.then(function() {
          pageRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });
      document.getElementById('pageInput').value = num;
      highlightActiveBookmark(num);
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function goToPage(num) {
      if (!pdfDoc) return;
      const p = Math.max(1, Math.min(pdfDoc.numPages, parseInt(num) || 1));
      pageNum = p;
      queueRenderPage(pageNum);
    }

    // PDF読み込み・解析
    function loadPdfFile(file) {
      const fileReader = new FileReader();
      fileReader.onload = async function() {
        const typedarray = new Uint8Array(this.result);
        try {
          pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
          document.getElementById('pageTotal').innerText = `/ ${pdfDoc.numPages}`;
          document.getElementById('pageInput').max = pdfDoc.numPages;
          document.getElementById('dropPrompt').classList.add('hidden');
          document.getElementById('pdfCanvasContainer').classList.remove('hidden');

          // しおりデータの取得と構造解析
          const outline = await pdfDoc.getOutline();
          bookmarkDatabase = [];
          if (outline) {
            await parseOutlineTree(outline);
            // 実際にPDFに存在する長さリストで再構築
            populateExtractedOptions();
            const list = filterBookmarks();
            renderBookmarkList(list);
          }

          renderPage(1);
        } catch (err) {
          alert('PDFの読み込みまたは解析に失敗しました: ' + err.message);
        }
      };
      fileReader.readAsArrayBuffer(file);
    }

    // しおりの階層ツリー解析（親階層の仕様・角度・半径を子階層へ引き継ぎ）
    async function parseOutlineTree(items, parentContext = {}) {
      for (const item of items) {
        let title = item.title.trim();
        let targetPage = null;

        if (item.dest) {
          let dest = item.dest;
          if (typeof dest === 'string') {
            dest = await pdfDoc.getDestination(dest);
          }
          if (dest && dest[0]) {
            const pageIndex = await pdfDoc.getPageIndex(dest[0]);
            targetPage = pageIndex + 1;
          }
        }

        let context = { ...parentContext };

        // 1. 仕様判定
        if (title.includes('SWSL')) context.type = 'SWSL';
        else if (title.includes('SSL/LSL')) context.type = 'SSL/LSL';
        else if (title.includes('SSL')) context.type = 'SSL';
        else if (title.includes('SH/LH')) context.type = 'SH/LH';
        else if (title.includes('SH')) context.type = 'SH';
        else if (title.includes('LH')) context.type = 'LH';
        else if (title.includes('SW')) context.type = 'SW';
        else if (title.includes('LFVL') || title.includes('LF')) context.type = 'LFVL';

        // 2. 角度判定 (87°, 85°, 75°, 65° 等)
        const angleMatch = title.match(/(\d{2})[°度]/);
        if (angleMatch) context.angle = angleMatch[1] + '°';

        // 3. 半径判定 (24m, 21m, 18m, 15m 等)
        const radiusMatch = title.match(/SL[^\d]*(\d{1,2})m/i) || title.match(/半径[^\d]*(\d{1,2})m/);
        if (radiusMatch) context.radius = radiusMatch[1] + 'm';

        // 4. 主ジブ長さ・補ジブ長さ判定（柔軟な正規表現）
        // パターンA: "主ジブ60m" や "主 60m"
        const mainExplicit = title.match(/主(?:ジブ)?[^\d]*(\d{2,3})m/);
        if (mainExplicit) context.mainBoom = mainExplicit[1] + 'm';

        // パターンB: "補ジブ48m" や "ジブ48m" や "+ 48m"
        const jibExplicit = title.match(/(?:補|ラフィング)?ジブ[^\d]*(\d{2,3})m/) || title.match(/\+\s*(\d{2,3})m/);
        if (jibExplicit) context.jib = jibExplicit[1] + 'm';

        // パターンC: "60m + 48m" や "60m / 48m" などの併記
        const comboMatch = title.match(/(\d{2,3})m\s*[\+\/_\-]\s*(\d{2,3})m/);
        if (comboMatch) {
          context.mainBoom = comboMatch[1] + 'm';
          context.jib = comboMatch[2] + 'm';
        } else if (!context.mainBoom) {
          // パターンD: 単独の "60m" 表記
          const singleM = title.match(/^(\d{2,3})m$/) || title.match(/^(\d{2,3})m\b/);
          if (singleM) context.mainBoom = singleM[1] + 'm';
        }

        if (targetPage) {
          bookmarkDatabase.push({
            title: title,
            page: targetPage,
            type: context.type || '',
            angle: context.angle || '',
            radius: context.radius || '',
            mainBoom: context.mainBoom || '',
            jib: context.jib || ''
          });
        }

        if (item.items && item.items.length > 0) {
          await parseOutlineTree(item.items, context);
        }
      }
    }

    // 抽出された実際のリストをドロップダウンへ反映
    function populateExtractedOptions() {
      const extractedMain = [...new Set(bookmarkDatabase.map(b => b.mainBoom).filter(Boolean))]
        .sort((a,b) => parseInt(a)-parseInt(b));
      const extractedJib = [...new Set(bookmarkDatabase.map(b => b.jib).filter(Boolean))]
        .sort((a,b) => parseInt(a)-parseInt(b));

      if (extractedMain.length > 0) {
        document.getElementById('selMainBoom').innerHTML = '<option value="">指定なし</option>' + 
          extractedMain.map(b => `<option value="${b}">${b}</option>`).join('');
      }
      if (extractedJib.length > 0) {
        document.getElementById('selJib').innerHTML = '<option value="">指定なし</option>' + 
          extractedJib.map(j => `<option value="${j}">${j}</option>`).join('');
      }
    }

    // フィルタリング処理（部分一致・階層考慮）
    function filterBookmarks() {
      const t = document.getElementById('selType').value;
      const a = document.getElementById('selAngle').value;
      const r = document.getElementById('selRadius').value;
      const m = document.getElementById('selMainBoom').value;
      const j = document.getElementById('selJib').value;
      const q = document.getElementById('outlineSearch').value.toLowerCase().trim();

      const filtered = bookmarkDatabase.filter(b => {
        if (t && b.type && b.type !== t) return false;
        if (a && b.angle && b.angle !== a) return false;
        if (r && b.radius && b.radius !== r) return false;
        if (m && b.mainBoom && b.mainBoom !== m) return false;
        if (j && b.jib && b.jib !== j) return false;
        if (q && !b.title.toLowerCase().includes(q)) return false;
        return true;
      });

      document.getElementById('matchCount').innerText = `${filtered.length} 件`;
      return filtered;
    }

    // しおり一覧の描画
    function renderBookmarkList(list) {
      const container = document.getElementById('outlineContainer');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<div class="text-xs text-slate-500 p-4 text-center">条件に一致する荷重表が見つかりません。<br>条件を「指定なし」にしてお試しください。</div>';
        return;
      }

      // 上位100件を表示して快適性を維持
      const showList = list.slice(0, 100);
      const frag = document.createDocumentFragment();

      showList.forEach(item => {
        const btn = document.createElement('div');
        btn.className = "outline-item group flex items-center justify-between px-2.5 py-1.5 rounded bg-slate-950/40 hover:bg-slate-800 border border-slate-800/80 hover:border-amber-500/50 cursor-pointer text-xs transition-colors";
        btn.dataset.page = item.page;

        btn.innerHTML = `
          <div class="truncate pr-2">
            <span class="font-medium text-slate-200 group-hover:text-amber-400">${item.title}</span>
            <div class="text-[10px] text-slate-500 flex items-center gap-1.5 mt-0.5">
              ${item.type ? `<span class="bg-slate-800 px-1 py-0.2 rounded text-slate-400">${item.type}</span>` : ''}
              ${item.angle ? `<span class="text-amber-400/80">${item.angle}</span>` : ''}
              ${item.radius ? `<span>${item.radius}</span>` : ''}
              ${item.mainBoom ? `<span>主:${item.mainBoom}</span>` : ''}
              ${item.jib ? `<span>補:${item.jib}</span>` : ''}
            </div>
          </div>
          <span class="font-tech text-amber-400 font-bold ml-1 shrink-0">P.${item.page}</span>
        `;

        btn.onclick = () => {
          goToPage(item.page);
          if (window.innerWidth < 768) {
            document.getElementById('sidebar').classList.add('-translate-x-full');
          }
        };
        frag.appendChild(btn);
      });
      container.appendChild(frag);
    }

    // ドロップダウン変更時に再検索
    ['selType', 'selAngle', 'selRadius', 'selMainBoom', 'selJib'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => {
        renderBookmarkList(filterBookmarks());
      });
    });

    document.getElementById('outlineSearch').addEventListener('input', () => {
      renderBookmarkList(filterBookmarks());
    });

    // 「該当する荷重表を開く」ボタン（最上位一致ページへジャンプ）
    document.getElementById('directJumpBtn').addEventListener('click', () => {
      const filtered = filterBookmarks();
      if (filtered.length > 0) {
        goToPage(filtered[0].page);
        if (window.innerWidth < 768) {
          document.getElementById('sidebar').classList.add('-translate-x-full');
        }
      } else {
        alert('条件に一致するページが見つかりませんでした。「指定なし」に戻してお試しください。');
      }
    });

    function highlightActiveBookmark(currentPage) {
      document.querySelectorAll('.outline-item').forEach(el => {
        if (parseInt(el.dataset.page) === currentPage) {
          el.classList.add('bg-amber-500/20', 'border-amber-500');
        } else {
          el.classList.remove('bg-amber-500/20', 'border-amber-500');
        }
      });
    }

    // イベント設定
    document.getElementById('filePicker').addEventListener('change', (e) => loadPdfFile(e.target.files[0]));
    document.getElementById('mainFilePicker').addEventListener('change', (e) => loadPdfFile(e.target.files[0]));

    document.getElementById('prevPageBtn').addEventListener('click', () => { if (pageNum > 1) goToPage(pageNum - 1); });
    document.getElementById('nextPageBtn').addEventListener('click', () => { if (pdfDoc && pageNum < pdfDoc.numPages) goToPage(pageNum + 1); });
    document.getElementById('pageInput').addEventListener('change', (e) => goToPage(e.target.value));

    document.getElementById('zoomInBtn').addEventListener('click', () => {
      scale = Math.min(3.0, scale + 0.2);
      document.getElementById('zoomLevel').innerText = Math.round((scale / 1.35) * 100) + '%';
      if (pdfDoc) queueRenderPage(pageNum);
    });
    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      scale = Math.max(0.6, scale - 0.2);
      document.getElementById('zoomLevel').innerText = Math.round((scale / 1.35) * 100) + '%';
      if (pdfDoc) queueRenderPage(pageNum);
    });

    document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    });
    document.getElementById('closeSidebarBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.add('-translate-x-full');
    });

    lucide.createIcons();
  </script>
</body>
</html>
