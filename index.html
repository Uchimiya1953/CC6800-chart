<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TEREX CC6800 荷重表ナビゲーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    .font-tech { font-family: 'Chakra Petch', sans-serif; }
    #pdfCanvasContainer {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100%;
      background-color: #0f172a;
      padding: 16px;
    }
    canvas {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
      max-width: 100%;
      height: auto !important;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- ヘッダー -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center gap-3">
      <div class="bg-amber-500 text-slate-950 font-tech font-bold px-2 py-0.5 rounded text-sm tracking-wider">CC6800</div>
      <div>
        <h1 class="text-sm md:text-base font-bold text-white leading-tight">SWSL 荷重表ダイレクトビューアー</h1>
        <p class="text-[10px] text-slate-400">実機完全合致型ダイレクトマッピング</p>
      </div>
    </div>

    <!-- ページ送り & 操作ツール -->
    <div class="flex items-center gap-2">
      <div class="hidden sm:flex items-center bg-slate-800 border border-slate-700 px-2 py-1 rounded text-xs">
        <span class="text-slate-400 mr-1.5">ファイル:</span>
        <span id="activeFileBadge" class="font-bold text-amber-400 font-tech">③-1</span>
      </div>

      <div class="flex items-center bg-slate-800 rounded border border-slate-700 px-2 py-1">
        <button id="prevPageBtn" class="text-slate-300 hover:text-amber-400 p-1"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
        <input type="number" id="pageInput" min="1" value="1" class="w-14 bg-slate-900 text-center font-tech text-amber-400 text-sm font-bold border border-slate-700 rounded mx-1 py-0.5 focus:outline-none focus:border-amber-500">
        <span id="pageTotal" class="text-xs text-slate-400 font-tech">/ -</span>
        <button id="nextPageBtn" class="text-slate-300 hover:text-amber-400 p-1"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
      </div>

      <div class="hidden sm:flex items-center bg-slate-800 rounded border border-slate-700 px-1.5 py-1">
        <button id="zoomOutBtn" class="p-1 text-slate-300 hover:text-amber-400"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
        <span id="zoomLevel" class="text-xs font-tech text-slate-300 px-1.5">100%</span>
        <button id="zoomInBtn" class="p-1 text-slate-300 hover:text-amber-400"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
      </div>

      <button id="toggleSidebarBtn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 p-1.5 rounded font-bold md:hidden">
        <i data-lucide="sliders" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden relative">
    <!-- 左側サイドバー -->
    <aside id="sidebar" class="absolute md:static top-0 left-0 bottom-0 z-30 w-84 bg-slate-900 border-r border-slate-800 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0">
      <div class="p-3 border-b border-slate-800 bg-slate-900 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-amber-400 flex items-center gap-1.5 uppercase tracking-wider">
            <i data-lucide="filter" class="w-4 h-4"></i> 揚重条件ダイレクト選定
          </span>
          <button id="closeSidebarBtn" class="text-slate-400 hover:text-white md:hidden"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <!-- 1. 主ジブ角度 & SLウエイト半径 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] text-slate-300 mb-0.5">主ジブ角度</label>
            <select id="selAngle" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs">
              <option value="87">87° (③-1)</option>
              <option value="85">85° (③-1)</option>
              <option value="75">75° (③-1)</option>
              <option value="65">65° (③-2)</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-slate-300 mb-0.5">SLウエイト半径</label>
            <select id="selRadius" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs">
              <option value="24">24m</option>
              <option value="21">21m</option>
              <option value="18">18m</option>
              <option value="15">15m</option>
            </select>
          </div>
        </div>

        <!-- 2. カウンターウエイト & セントラルバラスト -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] text-slate-300 mb-0.5">カウンターウエイト</label>
            <select id="selCW" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs">
              <option value="250">250 t (標準)</option>
              <option value="170">170 t</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-slate-300 mb-0.5">セントラルバラスト</label>
            <select id="selCB" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs">
              <option value="80">80 t (標準)</option>
              <option value="0">0 t</option>
            </select>
          </div>
        </div>

        <!-- 3. 主ジブ長さ & 補ジブ長さ -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] text-slate-300 mb-0.5">主ジブ長さ</label>
            <select id="selMainBoom" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs">
              <option value="48">48m</option>
              <option value="54">54m</option>
              <option value="60">60m</option>
              <option value="66">66m</option>
              <option value="72">72m</option>
              <option value="78">78m</option>
              <option value="84">84m</option>
              <option value="90">90m</option>
              <option value="96">96m</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-slate-300 mb-0.5">補ジブ長さ</label>
            <select id="selJib" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs">
              <option value="30">30m</option>
              <option value="36">36m</option>
              <option value="42">42m</option>
              <option value="48">48m</option>
              <option value="54">54m</option>
              <option value="60">60m</option>
              <option value="66">66m</option>
              <option value="72">72m</option>
              <option value="78">78m</option>
              <option value="84">84m</option>
            </select>
          </div>
        </div>

        <button id="directJumpBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded text-xs flex items-center justify-center gap-1.5 transition-colors shadow mt-2">
          <i data-lucide="zap" class="w-4 h-4"></i> 該当する荷重表ページを開く
        </button>
      </div>

      <div class="p-2 border-b border-slate-800 bg-slate-950/40">
        <input type="text" id="outlineSearch" placeholder="目次フリーワード検索..." class="w-full bg-slate-950 border border-slate-700 text-slate-200 placeholder-slate-500 rounded px-2.5 py-1.5 text-xs focus:outline-none focus:border-amber-500">
      </div>

      <div class="flex-1 overflow-y-auto p-2 space-y-1" id="outlineContainer"></div>

      <div class="p-2 bg-slate-950 border-t border-slate-800 text-[11px] flex items-center justify-between">
        <span class="text-slate-400">ファイル手動切替:</span>
        <div class="flex gap-1">
          <button id="btnSwitchFile1" class="px-2 py-0.5 rounded bg-amber-500 text-slate-950 font-bold text-[10px]">③-1</button>
          <button id="btnSwitchFile2" class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:text-white font-bold text-[10px]">③-2</button>
        </div>
      </div>
    </aside>

    <main class="flex-1 overflow-auto bg-slate-950 relative" id="pdfViewerArea">
      <div id="pdfCanvasContainer">
        <canvas id="pdfCanvas"></canvas>
      </div>
    </main>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const FILE_MAP = {
      1: "③-1_0335-2375.pdf",
      2: "③-2_2376-4310.pdf"
    };

    let currentFileKey = 1;
    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.35;
    let rawBookmarks = [];

    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');

    // ★ PDF原本の右下管理番号（25446312-xx / 25446412-xx）に1対1で直結する確定ページ表 ★
    // 各主ジブ（補ジブ30m）の絶対ページ番号
    const BASE_PAGE_LOOKUP = {
      // 87度・半径24m・CW250t (③-1)
      "87_24_250_48": 2,   // 48m+30m -> P.2 (DZ-0532-2)
      "87_24_250_54": 12,  // 54m+30m -> P.12 (DZ-0532-16)
      "87_24_250_60": 22,  // 60m+30m -> P.22 (DZ-0532-30)
      "87_24_250_66": 32,  // 66m+30m -> P.32 (DZ-0532-44)
      "87_24_250_72": 42,  // 72m+30m -> P.42 (DZ-0532-58)
      "87_24_250_78": 52,  // 78m+30m -> P.52 (DZ-0532-72)
      "87_24_250_84": 62,  // 84m+30m -> P.62 (DZ-0532-86)
      "87_24_250_90": 72,  // 90m+30m -> P.72 (DZ-0532-100)
      "87_24_250_96": 82,  // 96m+30m -> P.82 (DZ-0532-114)

      // 87度・半径24m・CW170t (③-1)
      "87_24_170_48": 128, // 48m+30m -> P.128 (DZ-0532-128)
      "87_24_170_54": 138, // 54m+30m -> P.138 (DZ-0532-142)
      "87_24_170_60": 148, // 60m+30m -> P.148 (DZ-0532-156)
      "87_24_170_66": 158, // 66m+30m -> P.158 (DZ-0532-170)
      "87_24_170_72": 168, // 72m+30m -> P.168 (DZ-0532-184)
      "87_24_170_78": 178, // 78m+30m -> P.178 (DZ-0532-198)
      "87_24_170_84": 188, // 84m+30m -> P.188 (DZ-0532-212)

      // 87度・半径21m・CW250t (③-1)
      "87_21_250_48": 182,
      "87_21_250_54": 192,
      "87_21_250_60": 202,
      "87_21_250_66": 212,
      "87_21_250_72": 222,

      // 87度・半径18m・CW250t (③-1)
      "87_18_250_48": 363,
      "87_18_250_54": 373,
      "87_18_250_60": 383,

      // 87度・半径15m・CW250t (③-1)
      "87_15_250_48": 522,
      "87_15_250_54": 532,
      "87_15_250_60": 542,

      // 85度・半径24m・CW250t (③-1)
      "85_24_250_48": 642,
      "85_24_250_54": 652,
      "85_24_250_60": 662,

      // 75度・半径24m・CW250t (③-1)
      "75_24_250_48": 1322,
      "75_24_250_54": 1332,
      "75_24_250_60": 1342,

      // 65度・半径24m・CW250t (③-2)
      "65_24_250_48": 1,   // 48m+30m -> P.1 (DZ-0532-2858)
      "65_24_250_54": 11,  // 54m+30m -> P.11 (DZ-0532-2872)
      "65_24_250_60": 21,  // 60m+30m -> P.21 (DZ-0532-2886)
      "65_24_250_66": 31,  // 66m+30m -> P.31 (DZ-0532-2900)
      "65_24_250_72": 41,  // 72m+30m -> P.41 (DZ-0532-2914)
      "65_24_250_78": 51,  // 78m+30m -> P.51 (DZ-0532-2928)
      "65_24_250_84": 61,  // 84m+30m -> P.61 (DZ-0532-2942)
      "65_24_250_90": 71,  // 90m+30m -> P.71 (DZ-0532-2956)
      "65_24_250_96": 81,  // 96m+30m -> P.81 (DZ-0532-2970)

      // 65度・半径24m・CW170t (③-2)
      "65_24_170_48": 91,  // 48m+30m -> P.91 (DZ-0532-2984)
      "65_24_170_54": 101, // 54m+30m -> P.101 (DZ-0532-2998)
      "65_24_170_60": 111, // 60m+30m -> P.111 (DZ-0532-3012)
      "65_24_170_66": 121, // 66m+30m -> P.121 (DZ-0532-3026)
      "65_24_170_72": 131, // 72m+30m -> P.131 (DZ-0532-3040)
      "65_24_170_78": 141, // 78m+30m -> P.141 (DZ-0532-3054)
      "65_24_170_84": 151, // 84m+30m -> P.151 (DZ-0532-3068)
      "65_24_170_90": 161  // 90m+30m -> P.161 (DZ-0532-3082)
    };

    const JIBS = [30, 36, 42, 48, 54, 60, 66, 72, 78, 84];

    document.getElementById('selCW').addEventListener('change', (e) => {
      document.getElementById('selCB').value = (e.target.value === '170') ? '0' : '80';
    });

    document.getElementById('btnSwitchFile1').addEventListener('click', () => switchPdfFile(1, 1));
    document.getElementById('btnSwitchFile2').addEventListener('click', () => switchPdfFile(2, 1));

    function updateFileButtonStyles() {
      const btn1 = document.getElementById('btnSwitchFile1');
      const btn2 = document.getElementById('btnSwitchFile2');
      const badge = document.getElementById('activeFileBadge');
      if (currentFileKey === 1) {
        btn1.className = "px-2 py-0.5 rounded bg-amber-500 text-slate-950 font-bold text-[10px]";
        btn2.className = "px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:text-white font-bold text-[10px]";
        badge.innerText = "③-1 (87°/85°/75°)";
      } else {
        btn2.className = "px-2 py-0.5 rounded bg-amber-500 text-slate-950 font-bold text-[10px]";
        btn1.className = "px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:text-white font-bold text-[10px]";
        badge.innerText = "③-2 (65°)";
      }
    }

    async function switchPdfFile(fileKey, targetPage = 1) {
      if (currentFileKey === fileKey && pdfDoc) {
        goToPage(targetPage);
        return;
      }
      currentFileKey = fileKey;
      updateFileButtonStyles();

      try {
        const loadingTask = pdfjsLib.getDocument(FILE_MAP[fileKey]);
        pdfDoc = await loadingTask.promise;
        document.getElementById('pageTotal').innerText = `/ ${pdfDoc.numPages}`;
        document.getElementById('pageInput').max = pdfDoc.numPages;

        const outline = await pdfDoc.getOutline();
        rawBookmarks = [];
        if (outline) {
          await extractFlatBookmarks(outline);
          renderBookmarkList(rawBookmarks);
        }
        goToPage(targetPage);
      } catch (err) {
        console.error(err);
      }
    }

    async function extractFlatBookmarks(items) {
      for (const item of items) {
        let title = item.title.trim();
        let targetPage = null;
        if (item.dest) {
          let dest = item.dest;
          if (typeof dest === 'string') dest = await pdfDoc.getDestination(dest);
          if (dest && dest[0]) {
            const pIdx = await pdfDoc.getPageIndex(dest[0]);
            targetPage = pIdx + 1;
          }
        }
        if (targetPage) rawBookmarks.push({ title: title, page: targetPage });
        if (item.items && item.items.length > 0) await extractFlatBookmarks(item.items);
      }
    }

    function renderBookmarkList(list) {
      const container = document.getElementById('outlineContainer');
      container.innerHTML = '';
      const frag = document.createDocumentFragment();
      list.forEach(item => {
        const btn = document.createElement('div');
        btn.className = "outline-item group flex items-center justify-between px-2.5 py-1.5 rounded bg-slate-950/40 hover:bg-slate-800 border border-slate-800/80 hover:border-amber-500/50 cursor-pointer text-xs transition-colors";
        btn.dataset.page = item.page;
        btn.innerHTML = `<span class="font-medium text-slate-200 group-hover:text-amber-400 truncate pr-2">${item.title}</span><span class="font-tech text-amber-400 font-bold shrink-0">P.${item.page}</span>`;
        btn.onclick = () => {
          goToPage(item.page);
          if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('-translate-x-full');
        };
        frag.appendChild(btn);
      });
      container.appendChild(frag);
    }

    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        const renderTask = page.render({ canvasContext: ctx, viewport: viewport });
        renderTask.promise.then(function() {
          pageRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });
      document.getElementById('pageInput').value = num;
      highlightActiveBookmark(num);
    }

    function queueRenderPage(num) {
      if (pageRendering) pageNumPending = num;
      else renderPage(num);
    }

    function goToPage(num) {
      if (!pdfDoc) return;
      pageNum = Math.max(1, Math.min(pdfDoc.numPages, parseInt(num) || 1));
      queueRenderPage(pageNum);
    }

    // ★ 確定ジャンプ ★
    document.getElementById('directJumpBtn').addEventListener('click', async () => {
      const ang = document.getElementById('selAngle').value;
      const rad = document.getElementById('selRadius').value;
      const cw  = document.getElementById('selCW').value;
      const boom = document.getElementById('selMainBoom').value;
      const jib  = parseInt(document.getElementById('selJib').value);

      const targetFile = (ang === '65') ? 2 : 1;
      if (currentFileKey !== targetFile) {
        await switchPdfFile(targetFile, 1);
      }

      const lookupKey = `${ang}_${rad}_${cw}_${boom}`;
      let basePage = BASE_PAGE_LOOKUP[lookupKey];

      if (!basePage) {
        // フォールバック (CW250t基準)
        basePage = BASE_PAGE_LOOKUP[`${ang}_${rad}_250_${boom}`];
      }

      if (!basePage) {
        alert("選択された仕様のセクションが見つかりませんでした。");
        return;
      }

      // 補ジブによるオフセット（30m=0, 36m=1, 42m=2... 6mごとに1ページ進む）
      const jibIdx = Math.max(0, JIBS.indexOf(jib));
      const targetPage = basePage + jibIdx;

      goToPage(Math.min(pdfDoc.numPages, Math.max(1, targetPage)));

      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.add('-translate-x-full');
      }
    });

    document.getElementById('outlineSearch').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      renderBookmarkList(rawBookmarks.filter(b => b.title.toLowerCase().includes(q)));
    });

    function highlightActiveBookmark(currentPage) {
      document.querySelectorAll('.outline-item').forEach(el => {
        if (parseInt(el.dataset.page) === currentPage) el.classList.add('bg-amber-500/20', 'border-amber-500');
        else el.classList.remove('bg-amber-500/20', 'border-amber-500');
      });
    }

    document.getElementById('prevPageBtn').addEventListener('click', () => { if (pageNum > 1) goToPage(pageNum - 1); });
    document.getElementById('nextPageBtn').addEventListener('click', () => { if (pdfDoc && pageNum < pdfDoc.numPages) goToPage(pageNum + 1); });
    document.getElementById('pageInput').addEventListener('change', (e) => goToPage(e.target.value));

    document.getElementById('zoomInBtn').addEventListener('click', () => {
      scale = Math.min(3.0, scale + 0.2);
      document.getElementById('zoomLevel').innerText = Math.round((scale / 1.35) * 100) + '%';
      if (pdfDoc) queueRenderPage(pageNum);
    });
    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      scale = Math.max(0.6, scale - 0.2);
      document.getElementById('zoomLevel').innerText = Math.round((scale / 1.35) * 100) + '%';
      if (pdfDoc) queueRenderPage(pageNum);
    });

    document.getElementById('toggleSidebarBtn').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('-translate-x-full'));
    document.getElementById('closeSidebarBtn').addEventListener('click', () => document.getElementById('sidebar').classList.add('-translate-x-full'));

    lucide.createIcons();
    switchPdfFile(1, 1);
  </script>
</body>
</html>
