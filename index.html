<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TEREX CC6800 荷重表ナビゲーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    .font-tech { font-family: 'Chakra Petch', sans-serif; }
    #pdfCanvasContainer {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100%;
      background-color: #0f172a;
      padding: 16px;
    }
    canvas {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
      max-width: 100%;
      height: auto !important;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- ヘッダー -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center gap-3">
      <div class="bg-amber-500 text-slate-950 font-tech font-bold px-2 py-0.5 rounded text-sm tracking-wider">CC6800</div>
      <div>
        <h1 class="text-sm md:text-base font-bold text-white leading-tight">SWSL 荷重表ダイレクトビューアー</h1>
        <p class="text-[10px] text-slate-400">PDF目次ツリー完全連動・確実ジャンプ版</p>
      </div>
    </div>

    <!-- ページ送り & 操作ツール -->
    <div class="flex items-center gap-2">
      <div class="hidden sm:flex items-center bg-slate-800 border border-slate-700 px-2 py-1 rounded text-xs">
        <span class="text-slate-400 mr-1.5">ファイル:</span>
        <span id="activeFileBadge" class="font-bold text-amber-400 font-tech">③-1</span>
      </div>

      <div class="flex items-center bg-slate-800 rounded border border-slate-700 px-2 py-1">
        <button id="prevPageBtn" class="text-slate-300 hover:text-amber-400 p-1"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
        <input type="number" id="pageInput" min="1" value="1" class="w-14 bg-slate-900 text-center font-tech text-amber-400 text-sm font-bold border border-slate-700 rounded mx-1 py-0.5 focus:outline-none focus:border-amber-500">
        <span id="pageTotal" class="text-xs text-slate-400 font-tech">/ -</span>
        <button id="nextPageBtn" class="text-slate-300 hover:text-amber-400 p-1"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
      </div>

      <div class="hidden sm:flex items-center bg-slate-800 rounded border border-slate-700 px-1.5 py-1">
        <button id="zoomOutBtn" class="p-1 text-slate-300 hover:text-amber-400" title="縮小"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
        <span id="zoomLevel" class="text-xs font-tech text-slate-300 px-1.5">100%</span>
        <button id="zoomInBtn" class="p-1 text-slate-300 hover:text-amber-400" title="拡大"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
      </div>

      <button id="toggleSidebarBtn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 p-1.5 rounded font-bold flex items-center gap-1 text-xs md:hidden">
        <i data-lucide="sliders" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- メインエリア -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- 左側サイドバー -->
    <aside id="sidebar" class="absolute md:static top-0 left-0 bottom-0 z-30 w-84 bg-slate-900 border-r border-slate-800 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0">
      
      <!-- 条件入力フィルター -->
      <div class="p-3 border-b border-slate-800 bg-slate-900/95 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-amber-400 flex items-center gap-1.5 uppercase tracking-wider">
            <i data-lucide="filter" class="w-4 h-4"></i> 揚重条件ダイレクト選定
          </span>
          <button id="closeSidebarBtn" class="text-slate-400 hover:text-white md:hidden">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- 1. 主ジブ角度 & SLウエイト半径 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-0.5">主ジブ角度</label>
            <select id="selAngle" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500">
              <option value="87">87° (③-1)</option>
              <option value="85">85° (③-1)</option>
              <option value="75">75° (③-1)</option>
              <option value="65">65° (③-2)</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-0.5">SLウエイト半径</label>
            <select id="selRadius" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500">
              <option value="24">24m</option>
              <option value="21">21m</option>
              <option value="18">18m</option>
              <option value="15">15m</option>
            </select>
          </div>
        </div>

        <!-- 2. カウンターウエイト & セントラルバラスト -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-0.5">カウンターウエイト</label>
            <select id="selCW" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500">
              <option value="250">250 t (標準)</option>
              <option value="170">170 t</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-0.5">セントラルバラスト</label>
            <select id="selCB" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500">
              <option value="80">80 t (標準)</option>
              <option value="0">0 t</option>
            </select>
          </div>
        </div>

        <!-- 3. 主ジブ長さ & 補ジブ長さ -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-0.5">主ジブ長さ</label>
            <select id="selMainBoom" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500">
              <option value="48">48m</option>
              <option value="54">54m</option>
              <option value="60">60m</option>
              <option value="66">66m</option>
              <option value="72">72m</option>
              <option value="78">78m</option>
              <option value="84">84m</option>
              <option value="90">90m</option>
              <option value="96">96m</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-0.5">補ジブ長さ</label>
            <select id="selJib" class="w-full bg-slate-950 border border-slate-700 text-white rounded px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500">
              <option value="30">30m</option>
              <option value="36">36m</option>
              <option value="42">42m</option>
              <option value="48">48m</option>
              <option value="54">54m</option>
              <option value="60">60m</option>
              <option value="66">66m</option>
              <option value="72">72m</option>
              <option value="78">78m</option>
              <option value="84">84m</option>
            </select>
          </div>
        </div>

        <!-- ダイレクトジャンプボタン -->
        <button id="directJumpBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded text-xs flex items-center justify-center gap-1.5 transition-colors shadow mt-2">
          <i data-lucide="zap" class="w-4 h-4"></i> 該当する荷重表ページを開く
        </button>
      </div>

      <!-- 目次検索 & ツリー -->
      <div class="p-2 border-b border-slate-800 bg-slate-950/40">
        <div class="relative">
          <input type="text" id="outlineSearch" placeholder="目次フリーワード検索..." class="w-full bg-slate-950 border border-slate-700 text-slate-200 placeholder-slate-500 rounded px-2.5 py-1.5 pl-8 text-xs focus:outline-none focus:border-amber-500">
          <i data-lucide="search" class="w-3.5 h-3.5 text-slate-500 absolute left-2.5 top-2.5"></i>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-2 space-y-1" id="outlineContainer">
        <div class="text-xs text-slate-500 p-4 text-center">しおりを読み込み中...</div>
      </div>

      <!-- 手動ファイル切替フッター -->
      <div class="p-2 bg-slate-950/90 border-t border-slate-800 text-[11px] flex items-center justify-between">
        <span class="text-slate-400">対象ファイル切替:</span>
        <div class="flex gap-1">
          <button id="btnSwitchFile1" class="px-2 py-0.5 rounded bg-amber-500 text-slate-950 font-bold text-[10px]">③-1</button>
          <button id="btnSwitchFile2" class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:text-white font-bold text-[10px]">③-2</button>
        </div>
      </div>
    </aside>

    <!-- PDF描画エリア -->
    <main class="flex-1 overflow-auto bg-slate-950 relative" id="pdfViewerArea">
      <div id="pdfCanvasContainer">
        <canvas id="pdfCanvas"></canvas>
      </div>
    </main>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';

    const FILE_MAP = {
      1: "③-1_0335-2375.pdf",
      2: "③-2_2376-4310.pdf"
    };

    let currentFileKey = 1;
    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.35;
    let bookmarkTree = [];
    let flatBookmarks = [];

    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');

    // ウエイト連動
    document.getElementById('selCW').addEventListener('change', (e) => {
      document.getElementById('selCB').value = (e.target.value === '170') ? '0' : '80';
    });

    document.getElementById('btnSwitchFile1').addEventListener('click', () => switchPdfFile(1, 1));
    document.getElementById('btnSwitchFile2').addEventListener('click', () => switchPdfFile(2, 1));

    function updateFileButtonStyles() {
      const btn1 = document.getElementById('btnSwitchFile1');
      const btn2 = document.getElementById('btnSwitchFile2');
      const badge = document.getElementById('activeFileBadge');

      if (currentFileKey === 1) {
        btn1.className = "px-2 py-0.5 rounded bg-amber-500 text-slate-950 font-bold text-[10px]";
        btn2.className = "px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:text-white font-bold text-[10px]";
        badge.innerText = "③-1 (87°/85°/75°)";
      } else {
        btn2.className = "px-2 py-0.5 rounded bg-amber-500 text-slate-950 font-bold text-[10px]";
        btn1.className = "px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:text-white font-bold text-[10px]";
        badge.innerText = "③-2 (65°)";
      }
    }

    async function switchPdfFile(fileKey, targetPage = 1) {
      if (currentFileKey === fileKey && pdfDoc) {
        goToPage(targetPage);
        return;
      }

      currentFileKey = fileKey;
      updateFileButtonStyles();
      document.getElementById('outlineContainer').innerHTML = 
        `<div class="text-xs text-slate-400 p-4 text-center">③-${fileKey} を読み込み中...</div>`;

      try {
        const loadingTask = pdfjsLib.getDocument(FILE_MAP[fileKey]);
        pdfDoc = await loadingTask.promise;
        document.getElementById('pageTotal').innerText = `/ ${pdfDoc.numPages}`;
        document.getElementById('pageInput').max = pdfDoc.numPages;

        const outline = await pdfDoc.getOutline();
        flatBookmarks = [];
        bookmarkTree = outline || [];

        if (outline) {
          await parseBookmarks(outline);
          renderBookmarkList(flatBookmarks);
        } else {
          document.getElementById('outlineContainer').innerHTML = 
            '<div class="text-xs text-slate-500 p-4 text-center">しおり情報がありません</div>';
        }

        goToPage(targetPage);
      } catch (err) {
        console.error(err);
        document.getElementById('outlineContainer').innerHTML = 
          `<div class="text-xs text-rose-400 p-4 text-center">PDF (${FILE_MAP[fileKey]}) の読み込みに失敗しました。</div>`;
      }
    }

    async function parseBookmarks(items, parentTitle = "") {
      for (const item of items) {
        let title = item.title.trim();
        let targetPage = null;

        if (item.dest) {
          let dest = item.dest;
          if (typeof dest === 'string') {
            dest = await pdfDoc.getDestination(dest);
          }
          if (dest && dest[0]) {
            const pageIndex = await pdfDoc.getPageIndex(dest[0]);
            targetPage = pageIndex + 1;
          }
        }

        const node = {
          title: title,
          page: targetPage,
          parent: parentTitle,
          children: []
        };

        if (targetPage) {
          flatBookmarks.push(node);
        }

        if (item.items && item.items.length > 0) {
          await parseBookmarks(item.items, title);
        }
      }
    }

    function renderBookmarkList(list) {
      const container = document.getElementById('outlineContainer');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<div class="text-xs text-slate-500 p-4 text-center">該当するしおりがありません。</div>';
        return;
      }

      const frag = document.createDocumentFragment();
      list.forEach(item => {
        const btn = document.createElement('div');
        btn.className = "outline-item group flex items-center justify-between px-2.5 py-1.5 rounded bg-slate-950/40 hover:bg-slate-800 border border-slate-800/80 hover:border-amber-500/50 cursor-pointer text-xs transition-colors";
        btn.dataset.page = item.page;

        btn.innerHTML = `
          <span class="font-medium text-slate-200 group-hover:text-amber-400 truncate pr-2">${item.title}</span>
          <span class="font-tech text-amber-400 font-bold shrink-0">P.${item.page}</span>
        `;

        btn.onclick = () => {
          goToPage(item.page);
          if (window.innerWidth < 768) {
            document.getElementById('sidebar').classList.add('-translate-x-full');
          }
        };
        frag.appendChild(btn);
      });
      container.appendChild(frag);
    }

    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = { canvasContext: ctx, viewport: viewport };
        const renderTask = page.render(renderContext);

        renderTask.promise.then(function() {
          pageRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });
      document.getElementById('pageInput').value = num;
      highlightActiveBookmark(num);
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function goToPage(num) {
      if (!pdfDoc) return;
      const p = Math.max(1, Math.min(pdfDoc.numPages, parseInt(num) || 1));
      pageNum = p;
      queueRenderPage(pageNum);
    }

    // ★ しおりツリーを検索して正規ページを正確に特定するジャンプ関数 ★
    document.getElementById('directJumpBtn').addEventListener('click', async () => {
      const angle = document.getElementById('selAngle').value;
      const radius = document.getElementById('selRadius').value;
      const cw = document.getElementById('selCW').value;
      const boom = document.getElementById('selMainBoom').value;
      const jib = document.getElementById('selJib').value;

      const targetFile = (angle === '65') ? 2 : 1;
      if (currentFileKey !== targetFile) {
        await switchPdfFile(targetFile, 1);
      }

      // 1. まず該当の「角度」と「半径」が含まれる大見出しのしおりを特定
      const rootTag = `SWSL${angle}°_SL半径${radius}m`;
      const rootBm = flatBookmarks.find(b => b.title.replace(/\s+/g, '').includes(rootTag));

      // 2. 「96m」や「72m」など、しおりの中にブーム長やジブ長が含まれている項目を探す
      // しおり内のブーム見出し（例: 96m や 96 m）を探索
      let matchedPage = null;

      // 範囲を絞り込む：次の大見出しまでの間から探す
      let startIndex = 0;
      let endIndex = flatBookmarks.length;

      if (rootBm) {
        const rIdx = flatBookmarks.indexOf(rootBm);
        startIndex = rIdx;
        for (let i = rIdx + 1; i < flatBookmarks.length; i++) {
          if (flatBookmarks[i].title.includes('SWSL') && flatBookmarks[i].title.includes('SL半径')) {
            endIndex = i;
            break;
          }
        }
      }

      const sectionBookmarks = flatBookmarks.slice(startIndex, endIndex);

      // セクション内からブーム長とジブ長に最も合致するしおりを検索
      const boomJibQuery = `${boom}m+${jib}m`;
      const boomJibAlt = `${boom}m`;

      let targetBm = sectionBookmarks.find(b => b.title.replace(/\s+/g, '').includes(boomJibQuery));

      if (!targetBm) {
        // ブーム長で探す
        const boomBm = sectionBookmarks.find(b => b.title.replace(/\s+/g, '') === `${boom}m` || b.title.replace(/\s+/g, '').includes(`${boom}m_`));
        if (boomBm) {
          // ジブのステップ（30m=0, 36m=1, 42m=2...）
          const jSteps = [30, 36, 42, 48, 54, 60, 66, 72, 78, 84];
          const jOffset = Math.max(0, jSteps.indexOf(parseInt(jib)));
          matchedPage = boomBm.page + jOffset;
        }
      } else {
        matchedPage = targetBm.page;
      }

      // 見つからなかった場合のフォールバック（大見出しベース）
      if (!matchedPage) {
        if (rootBm) {
          // CW 250t / 170t でブロックを分ける
          let baseP = rootBm.page;
          if (cw === '170') {
            baseP += 126;
          }
          // ブーム基準インデックス
          const BOOM_OFFSETS = { 48:0, 54:10, 60:20, 66:31, 72:42, 78:53, 84:64, 90:75, 96:86 };
          const jSteps = [30, 36, 42, 48, 54, 60, 66, 72, 78, 84];
          const bOff = BOOM_OFFSETS[boom] !== undefined ? BOOM_OFFSETS[boom] : 0;
          const jOff = Math.max(0, jSteps.indexOf(parseInt(jib)));
          matchedPage = baseP + bOff + jOff;
        } else {
          matchedPage = 2;
        }
      }

      const safePage = Math.min(pdfDoc.numPages, Math.max(1, matchedPage));
      goToPage(safePage);

      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.add('-translate-x-full');
      }
    });

    document.getElementById('outlineSearch').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = flatBookmarks.filter(b => b.title.toLowerCase().includes(q));
      renderBookmarkList(filtered);
    });

    function highlightActiveBookmark(currentPage) {
      document.querySelectorAll('.outline-item').forEach(el => {
        if (parseInt(el.dataset.page) === currentPage) {
          el.classList.add('bg-amber-500/20', 'border-amber-500');
        } else {
          el.classList.remove('bg-amber-500/20', 'border-amber-500');
        }
      });
    }

    document.getElementById('prevPageBtn').addEventListener('click', () => { if (pageNum > 1) goToPage(pageNum - 1); });
    document.getElementById('nextPageBtn').addEventListener('click', () => { if (pdfDoc && pageNum < pdfDoc.numPages) goToPage(pageNum + 1); });
    document.getElementById('pageInput').addEventListener('change', (e) => goToPage(e.target.value));

    document.getElementById('zoomInBtn').addEventListener('click', () => {
      scale = Math.min(3.0, scale + 0.2);
      document.getElementById('zoomLevel').innerText = Math.round((scale / 1.35) * 100) + '%';
      if (pdfDoc) queueRenderPage(pageNum);
    });
    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      scale = Math.max(0.6, scale - 0.2);
      document.getElementById('zoomLevel').innerText = Math.round((scale / 1.35) * 100) + '%';
      if (pdfDoc) queueRenderPage(pageNum);
    });

    document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    });
    document.getElementById('closeSidebarBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.add('-translate-x-full');
    });

    lucide.createIcons();

    // 初回ロード
    switchPdfFile(1, 1);
  </script>
</body>
</html>
